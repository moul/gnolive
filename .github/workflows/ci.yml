name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Exercise the CLI
        run: |
          printf 'package example\n\n// Remove this comment.\nfunc F() int { return 42 }\n' > example.gno
          go run . -once -file example.gno > output.gno
          grep -F 'return 42' output.gno
          ! grep -F 'Remove this comment' output.gno
